name: Build and deploy React frontend to Azure - Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        env:
         VITE_API_BASE_URL: https://drc-primary-school-api-hjddghe3hpd2cvgf.southafricanorth-01.azurewebsites.net
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: drc-primary-school-frontend
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE  }}
          package: frontend/dist
