name: Deploy DRC Primary School Backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: drc-primary-school-api
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "./drcbackend/drcbackend.csproj"

permissions:
  contents: read

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.PROJECT_PATH }}" --configuration Release --no-build --verbosity normal

      # Install Entity Framework Core CLI
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.29

      # Apply migrations directly to Azure SQL
      - name: Update Azure SQL Database
        env:
          AZURE_SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION }}
        run: |
          dotnet ef database update \
            --project "${{ env.PROJECT_PATH }}" \
            --connection "$AZURE_SQL_CONNECTION"

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ./publish
